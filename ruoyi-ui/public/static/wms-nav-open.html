<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>打开羽辽 WMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            background: #f5f7fa;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border-radius: 12px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,.06);
        }
        h1 { font-size: 18px; margin-bottom: 12px; color: #1a1a1a; }
        p { color: #666; margin-bottom: 16px; }
        a.btn {
            display: inline-block;
            padding: 12px 28px;
            background: #1677ff;
            color: #fff !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>羽辽 WMS</h1>
    <p id="msg">正在跳转…</p>
    <a id="retry" class="btn" href="#" style="display:none">点此继续</a>
</div>
<script>
(function () {
    var q = new URLSearchParams(location.search);
    var pc = (q.get('pc') || '').trim();
    var mobile = (q.get('mobile') || '').trim();
    var imSsoTicket = (q.get('imSsoTicket') || '').trim();
    function appendSso(url) {
        if (!imSsoTicket || !url) return url;
        return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'imSsoTicket=' + encodeURIComponent(imSsoTicket);
    }
    var ua = navigator.userAgent || '';
    var isMobile = /Android|iPhone|iPad|iPod|Mobile|Feishu|Lark|wxwork|MicroMessenger|WeCom/i.test(ua);
    var target = appendSso(isMobile ? (mobile || pc) : (pc || mobile));
    var msg = document.getElementById('msg');
    var retry = document.getElementById('retry');
    if (!target) {
        msg.textContent = '链接参数无效，请联系管理员检查快捷入口配置。';
        return;
    }
    retry.href = target;
    retry.style.display = 'inline-block';
    retry.textContent = isMobile ? '点此打开' : '点此在浏览器中打开';
    try {
        window.location.replace(target);
    } catch (e) {
        msg.textContent = '若未自动跳转，请点击下方按钮。';
    }
    setTimeout(function () {
        if (document.visibilityState !== 'hidden') {
            msg.textContent = '若未自动跳转，请点击下方按钮继续。';
        }
    }, 1200);
})();
</script>
</body>
</html>
