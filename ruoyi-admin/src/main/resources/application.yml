# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: E:/idea-work/RuoYi-AI-WMS/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# Apple IAP配置
apple:
  iap:
    shared-secret: 2b3fae50afc44f6c97203b88994110a6
    # HTTP代理（可选，解决国内服务器访问Apple验证超时问题）
    # 支持 http 和 socks5 两种类型
    proxy-host:
    proxy-port: 0
    proxy-type: http

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 允许循环依赖
  main:
    allow-circular-references: true
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（分钟，默认30分钟，改为24小时）
  expireTime: 1440

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.ruoyi.**.domain

# Springdoc配置
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# AI服务配置
ai:
  service:
    enabled: true
    # 通义千问配置
    qwen:
      api-key: sk-*********
      api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      model: qwen3.8-flash
      # qwen3.x 混合推理模型：录单/解析类任务显式关闭思考模式，避免先输出推理 token 导致响应慢
      thinking-enabled: false
      max-tokens: 2000
      temperature: 0.7
    # 多模态视觉模型配置（截图识别，复用qwen的api-key）
    vision:
      model: qwen3.8-omni-flash
      max-tokens: 2000
    # 语音识别模型配置（ASR，走 Recognition 实时识别 API，必须选带 realtime 的模型；复用qwen的api-key）
    # 注意：租户级"AI语音模型"配置优先于此处，若租户里存了 fun-asr-realtime 需在租户管理里同步改掉
    asr:
      model: paraformer-realtime-v2

# 云打印配置
cloud:
  print:
    enabled: false
    # 云打印供应商接口地址
    endpoint:
    # 应用ID（按供应商要求）
    app-id:
    # 打印机编码（按供应商要求）
    printer-code:
    # 认证信息（按供应商要求）
    api-key:
    # 认证请求头，默认 X-API-Key
    api-key-header: X-API-Key
    # 打印份数
    copies: 1
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
