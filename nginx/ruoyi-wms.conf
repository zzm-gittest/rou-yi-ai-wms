upstream ruoyi_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name zhicun.site www.zhicun.site;
    return 301 https://$host$request_uri;
}

# HTTPS 配置
server {
    listen 443 ssl http2;
    server_name zhicun.site www.zhicun.site;

    # SSL 证书配置（确认文件名和你上传的一致）
    ssl_certificate /etc/nginx/ssl/zhicun.site_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/zhicun.site.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 50m;

    # App 深链中转页（须在 SPA 兜底之前，否则 /app/open 会落到 index.html 显示前端 404）
    location = /app/open {
        return 302 /app/open.html$is_args$args;
    }
    location = /app/open.html {
        root /app/ruoyi-ui/dist;
        default_type text/html;
    }
    location = /static/wms-app-open.html {
        root /app/ruoyi-ui/dist;
        default_type text/html;
    }

    # 前端静态资源（SPA）
    location / {
        root /app/ruoyi-ui/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 保留旧版前缀，兼容已有 Web 端请求
    location /prod-api/ {
        proxy_pass http://ruoyi_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 上传文件目录（静态直出）
    location ^~ /profile/ {
        alias /app/uploadPath/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
